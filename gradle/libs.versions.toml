[versions]
agp = "9.1.1"
kotlin = "2.2.21"
# Car App Library: templates for AAOS and Android Auto. app-automotive provides CarAppActivity.
carApp = "1.7.0"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
coroutines = "1.10.2"
junit = "4.13.2"
json = "20251224"

[libraries]
androidx-car-app = { group = "androidx.car.app", name = "app", version.ref = "carApp" }
androidx-car-app-automotive = { group = "androidx.car.app", name = "app-automotive", version.ref = "carApp" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Android's org.json is a stub in local unit tests; the real one parses the timetable there.
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
